    html += '<div class="ui-hint">Drag to look around &middot; Tap a marker</div>';
    html += '<div class="ui-nav"><div class="nb">&lsaquo;</div><div class="nb play">&#9654;</div><div class="nb">&rsaquo;</div><span class="ui-count">' + (S.stop + 1) + ' / ' + STOPS.length + ' &nbsp;' + STOPS[S.stop] + '</span></div>';
    // mini map: island outlines, the road, and where you are
    const mx = x => 8 + (x + 21.5) / 37 * 160, mz = z => 8 + (z + 10.5) / 22 * 96;
    let svg = '<svg width="176" height="112" viewBox="0 0 176 112">';
    ISLES.forEach(I => { svg += '<ellipse cx="' + mx(I.c.x) + '" cy="' + mz(I.c.z) + '" rx="' + (I.r * 3.3) + '" ry="' + (I.r * 3.0) + '" fill="#a9c98a" stroke="#6f9a5a" stroke-width="1"/>'; });
    svg += '<polyline points="' + roadPts.map(p => mx(p.x) + ',' + mz(p.z)).join(' ') + '" fill="none" stroke="#fbf8f2" stroke-width="2" stroke-dasharray="3 2"/>';
    const here = [PS, R, B, L][S.stop]; svg += '<circle cx="' + mx(here.x) + '" cy="' + mz(here.z) + '" r="5" fill="#e39a3b" stroke="#fff" stroke-width="2"/></svg>';
    html += '<div class="mini">' + svg + '</div>';
    const anyOpen = (S.spots || []).some(s => s[2]);
    (S.spots || []).forEach(([p, label, open]) => { const [x, y] = prj(p); html += '<div class="hs" style="left:' + x + 'px;top:' + y + 'px;' + (anyOpen && !open ? 'opacity:.7' : '') + '"><div class="dot"></div>' + (open || anyOpen ? '' : '<div class="tag">' + label + '</div>') + '</div>';
      if (open) { const left = x > W - 340 ? x - 22 - 300 : x + 22; html += '<div class="pop" style="left:' + left + 'px;top:' + Math.max(90, y - 60) + 'px"><span class="x">&times;</span>' + open + '</div>'; } });
    T.innerHTML = html;
  }
  if (o.opening === 'A' && o.nameFont) { const e = T.querySelector('.tA h1'); e.style.font = o.nameFont; }
  if (o.opening === 'B') {
    T.innerHTML = '<div class="tB"><small>A chart of the work of</small><h1>Jarod Daws</h1><p>DevOps and platform engineer<br>Cloud platforms and automation</p><div class="rule"></div><div class="yrs">Surveyed 2019 to today</div></div><div class="hint" style="color:#2f2616">Scroll to set sail<i></i></div>';
    const lbl = (p, t, s) => { const v = p.clone().project(camera); const d = document.createElement('div'); d.className = 'mapl'; d.style.left = ((v.x * .5 + .5) * W) + 'px'; d.style.top = ((-v.y * .5 + .5) * H) + 'px'; d.innerHTML = t + '<span>' + s + '</span>'; T.appendChild(d); };
    lbl(V(PS.x, 0, PS.z + 2.4), 'Penn State', '2019'); lbl(V(R.x + 0.5, 0, R.z + 4.4), 'Raytheon', '2020 &ndash; 2022');
    lbl(V(B.x + 0.6, 0, B.z + 6.6), 'Booz Allen Hamilton', '2022 &ndash; now'); lbl(V(L.x + 0.4, 0, L.z + 3.4), 'The Lab', 'side projects');
    T.insertAdjacentHTML('beforeend', '<svg style="position:absolute;right:60px;bottom:60px" width="96" height="96" viewBox="-50 -50 100 100"><g fill="none" stroke="#3a2e1d" stroke-width="1"><circle r="40" opacity=".5"/><circle r="30" opacity=".35"/></g><path d="M0-46 7-7 46 0 7 7 0 46-7 7-46 0-7-7Z" fill="#faf5e8" stroke="#3a2e1d"/><path d="M0-46 7-7 0 0Z M46 0 7 7 0 0Z M0 46-7 7 0 0Z M-46 0-7-7 0 0Z" fill="#3a2e1d"/><text y="-50" text-anchor="middle" font-family="Fraunces" font-size="13" fill="#3a2e1d">N</text></svg>');
  }
  if (o.opening === 'C') T.innerHTML = '<div class="tC"><h1>Jarod <em>Daws</em></h1><p>DevOps and platform engineer &middot; Cloud platforms and automation</p></div><div class="hint" style="color:#fff">Scroll to descend<i></i></div>';
  if (o.year) { const d = document.createElement('div'); d.className = 'lab'; d.style.left = '40px'; d.style.top = '34px'; d.innerHTML = '<span style="font-size:13px">Now viewing</span><b style="font-size:40px;font-weight:300">' + o.year + '</b>'; ann.appendChild(d); }
  return true;
};

// ---------- Annotations ----------
const ann = document.getElementById('ann'), svg = document.getElementById('lines');
function note(p, title, sub, dx, dy) {
  const v = p.clone().project(camera), x = (v.x * .5 + .5) * W, y = (-v.y * .5 + .5) * H, tx = x + dx, ty = y + dy;
  svg.insertAdjacentHTML('beforeend', '<line x1="' + x + '" y1="' + y + '" x2="' + tx + '" y2="' + ty + '" stroke="#10202b" stroke-width="0.9"/><circle cx="' + x + '" cy="' + y + '" r="2.4" fill="#10202b"/>');
  const d = document.createElement('div'); d.className = 'lab'; d.innerHTML = '<b>' + title + '</b>' + (sub ? '<span>' + sub + '</span>' : '');
  d.style.left = (tx + (dx < 0 ? -6 : 6)) + 'px'; d.style.top = (ty - 16) + 'px';
  if (dx < 0) { d.style.transform = 'translateX(-100%)'; d.style.textAlign = 'right'; }
  ann.appendChild(d);
}
function drawNotes() {
  note(V(PS.x, 1.2, PS.z), 'Penn State', 'B.S. Electrical Engineering, 2019', 120, 20);
  note(V(R.x - 0.3, RY + 2.0, R.z - 0.4), 'Raytheon', '2020 to 2022, seven releases', -70, -110);
  note(V(B.x, BY + 1.5, B.z), 'Booz Allen Hamilton', '2022 to now', 40, -150);
  note(V(L.x, LY + 0.6, L.z), 'The lab', 'Side projects', 60, -80);
}
if (EXPORT) {
  const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const glb = await new GLTFExporter().parseAsync(OCC, { binary: true });
  window.__export = { pos: b64(P2.array.buffer), trees: TREES, booz: BOOZ.concat(PLACED), occ: b64(glb) };
} else window.renderFrame({ dayT: 0.42 });
window.__done = true;
</script>
